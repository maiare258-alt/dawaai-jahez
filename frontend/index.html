<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دوائي جاهز | توفر الأدوية في الصيدليات</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: #f5f4ef;
    color: #2c2c2a;
    margin: 0;
    padding: 20px;
  }
  .container { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  h3 { font-size: 15px; margin-top: 28px; }
  p.subtitle { color: #5f5e5a; font-size: 14px; margin-bottom: 24px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tabs button {
    flex: 1; padding: 10px; border: 1px solid #d3d1c7; border-radius: 8px;
    background: white; cursor: pointer; font-size: 14px;
  }
  .tabs button.active { border-color: #185fa5; color: #185fa5; font-weight: 500; }
  input, select {
    width: 100%; padding: 10px; border: 1px solid #d3d1c7; border-radius: 8px;
    font-size: 14px; margin-bottom: 12px; font-family: inherit;
  }
  .card {
    background: white; border: 1px solid #e5e3da; border-radius: 12px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 500; margin-top: 0; }
  .card .generic { font-size: 13px; color: #5f5e5a; margin-bottom: 10px; }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-top: 1px solid #eee;
  }
  .badge { font-size: 12px; padding: 4px 10px; border-radius: 6px; }
  .badge.yes { background: #eaf3de; color: #27500a; }
  .badge.no { background: #fcebeb; color: #501313; }
  .toggle-btn {
    font-size: 12px; padding: 5px 12px; border-radius: 6px; cursor: pointer; border: 1px solid;
  }
  .toggle-btn.yes { background: #eaf3de; color: #27500a; border-color: #97c459; }
  .toggle-btn.no { background: #fcebeb; color: #501313; border-color: #f09595; }
  .muted { color: #888780; font-size: 14px; }
  .auth-box { background: white; border: 1px solid #e5e3da; border-radius: 12px; padding: 20px; }
  .auth-box button.primary, button.primary {
    width: 100%; padding: 10px; background: #185fa5; color: white; border: none;
    border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 4px;
  }
  .link-btn { background: none; border: none; color: #185fa5; cursor: pointer; font-size: 13px; text-decoration: underline; padding: 0; }
  .danger-btn { background: none; border: none; color: #a33; cursor: pointer; font-size: 13px; text-decoration: underline; padding: 0; }
  .box { background: white; border: 1px solid #e5e3da; border-radius: 12px; padding: 16px 18px; margin-top: 8px; }
  #suggestions {
    position: absolute; top: 100%; right: 0; left: 0; z-index: 10;
    background: white; border: 1px solid #d3d1c7; border-radius: 8px;
    margin-top: -8px; overflow: hidden; display: none;
  }
  #suggestions.show { display: block; }
  #suggestions .suggestion-item {
    padding: 10px 14px; cursor: pointer; font-size: 14px; border-top: 1px solid #eee;
  }
  #suggestions .suggestion-item:first-child { border-top: none; }
  #suggestions .suggestion-item:hover { background: #f5f4ef; }
  #suggestions .suggestion-item .generic-hint { color: #888780; font-size: 12px; }
  .password-field {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid #d3d1c7; border-radius: 8px; margin-bottom: 12px; padding: 0 10px;
  }
  .password-field input {
    border: none; flex: 1; padding: 10px 0; margin-bottom: 0; font-size: 14px; font-family: inherit;
  }
  .password-field input:focus { outline: none; }
  .password-field .toggle-password {
    background: none; border: none; cursor: pointer; font-size: 16px; color: #888780; padding: 4px;
  }
  .btn-outline {
    display: inline-block; padding: 10px 20px; border-radius: 8px; border: 1px solid;
    background: white; cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit;
  }
  .btn-outline.blue { border-color: #185fa5; color: #185fa5; }
  .btn-outline.blue:hover { background: #eef4fa; }
  .btn-outline.red { border-color: #a33; color: #a33; }
  .btn-outline.red:hover { background: #fbeeee; }
</style>
</head>
<body>
<div class="container">
  <h1>دوائي جاهز</h1>
  <p class="subtitle">اعرف فوراً أي صيدلية يتوفر فيها دواؤك</p>

  <div class="tabs">
    <button id="tab-patient" class="active" onclick="showView('patient')">واجهة المريض</button>
    <button id="tab-pharmacist" onclick="showView('pharmacist')">لوحة الصيدلي</button>
    <button id="tab-admin" onclick="showView('admin')">الإدارة</button>
  </div>

  <div id="view-patient">
    <div id="on-duty-section"></div>
    <div style="position:relative;">
      <input id="search" type="text" placeholder="ابحث عن دواء... مثال: بنادول" oninput="onSearch()" autocomplete="off">
      <div id="suggestions"></div>
    </div>
    <div id="results"></div>
  </div>

  <div id="view-pharmacist" style="display:none;">
    <div id="pharmacist-auth-section"></div>
    <div id="pharmacist-dashboard" style="display:none;">
      <div class="muted" id="pharmacy-label" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;"></div>
      <div class="box" style="margin-bottom:20px;">
        <h3 style="margin-top:0;">حالة المناوبة</h3>
        <label style="display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:12px;">
          <input type="checkbox" id="duty-checkbox" onchange="onDutyToggle()"> صيدليتي مناوبة اليوم
        </label>
        <select id="duty-day" disabled>
          <option value="الأحد">الأحد</option>
          <option value="الاثنين">الاثنين</option>
          <option value="الثلاثاء">الثلاثاء</option>
          <option value="الأربعاء">الأربعاء</option>
          <option value="الخميس">الخميس</option>
          <option value="الجمعة">الجمعة</option>
          <option value="السبت">السبت</option>
        </select>
        <select id="duty-shift" disabled>
          <option value="طوال اليوم">طوال اليوم</option>
          <option value="صباحاً">صباحاً فقط</option>
          <option value="مساءً">مساءً فقط</option>
        </select>
        <button class="primary" onclick="saveDuty()">حفظ حالة المناوبة</button>
      </div>
      <div id="stock-list"></div>
      <p style="margin-top:32px;">
        <button class="btn-outline red" onclick="deleteMyAccount()">حذف حسابي نهائياً</button>
      </p>
    </div>
  </div>

  <div id="view-admin" style="display:none;">
    <div id="admin-auth-section"></div>
    <div id="admin-panel" style="display:none;"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
